<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almas Clothing - AI Assistant Demo</title>
  <link rel="stylesheet" href="chatbot.css">
  <style>
  </style>
</head>
<body>

  <div class="demo-label">Click the button below to open the Almas AI Assistant →</div>

  <!-- Floating Toggle Button -->
  <button id="almas-chat-toggle" aria-label="Open Almas AI Assistant">
    <!-- Chat Icon -->
    <svg class="icon-chat" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 10H6v-2h12v2zm0-3H6V7h12v2z"/>
    </svg>
    <!-- Close Icon -->
    <svg class="icon-close" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
    </svg>
  </button>

  <!-- Chat Widget -->
  <div id="almas-chat-widget" role="dialog" aria-label="Almas Clothing AI Assistant">

    <!-- Header -->
    <div id="almas-chat-header">
      <div class="almas-avatar">A</div>
      <div class="almas-header-info">
        <h4>Almas Assistant</h4>
        <span><span class="status-dot"></span> Online — Ready to help</span>
      </div>
    </div>

    <!-- Messages -->
    <div id="almas-chat-messages" aria-live="polite"></div>

    <!-- Quick Replies -->
    <div id="almas-quick-replies" class="almas-quick-replies"></div>

    <!-- Input Footer -->
    <div id="almas-chat-footer">
      <div class="almas-input-row">
        <textarea
          id="almas-input"
          placeholder="Ask about products, sizes, shipping..."
          rows="1"
          aria-label="Type your message"
        ></textarea>
        <button id="almas-send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
      <div class="almas-footer-note">Powered by Almas AI · Answers may not always be perfect</div>
    </div>

  </div>

  <!-- ═══════════════════════════════════════════════════════
       END CHATBOT WIDGET
       ═══════════════════════════════════════════════════════ -->

  <script src="chatbot.js"></script>
</body>
</html>
